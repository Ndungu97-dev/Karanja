<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | Karanja Cyber Solutions</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans">

  <!-- Dynamic Mounting Anchors -->
  <div id="navigation-container"></div>
  <div id="shared-header"></div>
  <div id="shared-modals"></div>
  <div id="shared-cart-drawer"></div>

  <!-- CONTACT CONTENT -->
  <section class="py-16">
    <div class="max-w-4xl mx-auto px-4 grid md:grid-cols-2 gap-12 items-start">
      
      <div>
        <h1 class="text-3xl font-extrabold text-white mb-4">Get in Touch</h1>
        <p class="text-slate-400 text-sm leading-relaxed mb-6">
          Reach out for cybersecurity audits, SOC threat monitoring setups, or enrollment inquiries for our academy modules.
        </p>

        <div class="space-y-4 font-mono text-xs text-slate-300">
          <div class="p-4 rounded-xl bg-slate-900 border border-slate-800 flex items-center space-x-3">
            <i class="fa-solid fa-phone text-cyan-400 text-base"></i>
            <div>
              <p class="text-slate-500">DIRECT PHONE / WHATSAPP</p>
              <a href="tel:0714436151" class="text-white font-bold hover:underline">0714436151</a>
            </div>
          </div>

          <div class="p-4 rounded-xl bg-slate-900 border border-slate-800 flex items-center space-x-3">
            <i class="fa-solid fa-location-dot text-cyan-400 text-base"></i>
            <div>
              <p class="text-slate-500">LOCATION</p>
              <p class="text-white font-bold">Kenya</p>
            </div>
          </div>
        </div>
      </div>

      <!-- FORM -->
      <form onsubmit="handleContact(event)" class="bg-slate-900 p-6 rounded-2xl border border-slate-800 space-y-4">
        <div>
          <label class="block text-xs font-mono text-slate-400 mb-1">FULL NAME</label>
          <input type="text" id="contactName" required class="w-full px-4 py-3 rounded-lg bg-slate-950 border border-slate-800 text-white text-xs outline-none focus:border-cyan-500">
        </div>
        <div>
          <label class="block text-xs font-mono text-slate-400 mb-1">EMAIL ADDRESS</label>
          <input type="email" id="contactEmail" required class="w-full px-4 py-3 rounded-lg bg-slate-950 border border-slate-800 text-white text-xs outline-none focus:border-cyan-500">
        </div>
        <div>
          <label class="block text-xs font-mono text-slate-400 mb-1">MESSAGE</label>
          <textarea id="contactMessage" rows="4" required class="w-full px-4 py-3 rounded-lg bg-slate-950 border border-slate-800 text-white text-xs outline-none focus:border-cyan-500"></textarea>
        </div>
        <button type="submit" class="w-full py-3 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold text-xs transition">Send Message</button>
      </form>

    </div>
  </section>

  <!-- SHARED JS ENGINE -->
  <script src="/js/app.js"></script>
  <script>
    async function handleContact(e) {
      e.preventDefault();
      const body = {
        fullName: document.getElementById('contactName').value,
        email: document.getElementById('contactEmail').value,
        message: document.getElementById('contactMessage').value
      };

      try {
        const res = await fetch('/api/contact', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const data = await res.json();
        alert(data.message);
        if (data.success) e.target.reset();
      } catch (err) {
        alert('Failed to send message.');
      }
    }
  </script>
</body>
</html>
