<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Academy & Shop | Karanja Cyber Solutions</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans">

  <!-- Dynamic Mounting Anchors -->
  <div id="navigation-container"></div>
  <div id="shared-header"></div>
  <div id="shared-modals"></div>
  <div id="shared-cart-drawer"></div>

  <!-- SHOP HERO -->
  <section class="py-16 border-b border-slate-800 bg-slate-900/40">
    <div class="max-w-7xl mx-auto px-4 text-center">
      <h1 class="text-4xl font-extrabold text-white mb-4">Cybersecurity Academy & Store</h1>
      <p class="text-slate-400 max-w-2xl mx-auto text-sm">
        Select from our 20 practical cybersecurity training modules. Add items to your cart, login or register, and process checkout. Call <a href="tel:0714436151" class="text-cyan-400 font-bold">0714436151</a> for help.
      </p>
    </div>
  </section>

  <!-- PRODUCTS GRID -->
  <section class="py-16">
    <div class="max-w-7xl mx-auto px-4">
      <div id="shopGrid" class="grid sm:grid-cols-2 lg:grid-cols-4 gap-6"></div>
    </div>
  </section>

  <!-- SHARED JS ENGINE -->
  <script src="/js/app.js"></script>
  <script>
    const catalog = [
      { id: 1, title: 'Ethical Hacking & Pentesting', price: 'KSh 15,000', numericPrice: 15000, duration: '8 Weeks', img: 'https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?auto=format&fit=crop&w=500&q=80' },
      { id: 2, title: 'Certified SOC Analyst', price: 'KSh 18,000', numericPrice: 18000, duration: '10 Weeks', img: 'https://images.unsplash.com/photo-1550751827-4bd374c3f58b?auto=format&fit=crop&w=500&q=80' },
      { id: 3, title: 'Web App Security (OWASP)', price: 'KSh 12,000', numericPrice: 12000, duration: '6 Weeks', img: 'https://images.unsplash.com/photo-1563986768609-322da13575f3?auto=format&fit=crop&w=500&q=80' },
      { id: 4, title: 'Cloud Security (AZ-104 & Bicep)', price: 'KSh 20,000', numericPrice: 20000, duration: '8 Weeks', img: 'https://images.unsplash.com/photo-1544197150-b99a580bb7a8?auto=format&fit=crop&w=500&q=80' },
      { id: 5, title: 'Cisco CCST Networking', price: 'KSh 10,000', numericPrice: 10000, duration: '5 Weeks', img: 'https://images.unsplash.com/photo-1558494949-ef010cbdcc31?auto=format&fit=crop&w=500&q=80' },
      { id: 6, title: 'Digital Forensics (DFIR)', price: 'KSh 16,000', numericPrice: 16000, duration: '8 Weeks', img: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=500&q=80' },
      { id: 7, title: 'Bug Bounty Reconnaissance', price: 'KSh 14,000', numericPrice: 14000, duration: '6 Weeks', img: 'https://images.unsplash.com/photo-1510511459019-5dda7724fd87?auto=format&fit=crop&w=500&q=80' },
      { id: 8, title: 'Docker & Container Hardening', price: 'KSh 11,000', numericPrice: 11000, duration: '4 Weeks', img: 'https://images.unsplash.com/photo-1605745341112-85968b19335b?auto=format&fit=crop&w=500&q=80' },
      { id: 9, title: 'Linux Systems Administration', price: 'KSh 9,000', numericPrice: 9000, duration: '5 Weeks', img: 'https://images.unsplash.com/photo-1629654297299-c8506221ca97?auto=format&fit=crop&w=500&q=80' },
      { id: 10, title: 'Wazuh SIEM & YARA Rules', price: 'KSh 15,000', numericPrice: 15000, duration: '6 Weeks', img: 'https://images.unsplash.com/photo-1551288049-bebda4e38f71?auto=format&fit=crop&w=500&q=80' },
      { id: 11, title: 'Python for Cyber Automation', price: 'KSh 10,000', numericPrice: 10000, duration: '5 Weeks', img: 'https://images.unsplash.com/photo-1526379095098-d400fd0bf935?auto=format&fit=crop&w=500&q=80' },
      { id: 12, title: 'Network Defense & Firewalls', price: 'KSh 13,000', numericPrice: 13000, duration: '6 Weeks', img: 'https://images.unsplash.com/photo-1544197150-b99a580bb7a8?auto=format&fit=crop&w=500&q=80' },
      { id: 13, title: 'API Security & Testing', price: 'KSh 12,500', numericPrice: 12500, duration: '4 Weeks', img: 'https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=500&q=80' },
      { id: 14, title: 'Red Teaming Operations', price: 'KSh 22,000', numericPrice: 22000, duration: '10 Weeks', img: 'https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?auto=format&fit=crop&w=500&q=80' },
      { id: 15, title: 'Blue Team Defense Strategy', price: 'KSh 17,000', numericPrice: 17000, duration: '8 Weeks', img: 'https://images.unsplash.com/photo-1550751827-4bd374c3f58b?auto=format&fit=crop&w=500&q=80' },
      { id: 16, title: 'Applied Cryptography & PKI', price: 'KSh 11,500', numericPrice: 11500, duration: '5 Weeks', img: 'https://images.unsplash.com/photo-1563986768609-322da13575f3?auto=format&fit=crop&w=500&q=80' },
      { id: 17, title: 'Wireless & IoT Security', price: 'KSh 10,500', numericPrice: 10500, duration: '4 Weeks', img: 'https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=500&q=80' },
      { id: 18, title: 'ISO 27001 & NIST Auditing', price: 'KSh 19,000', numericPrice: 19000, duration: '7 Weeks', img: 'https://images.unsplash.com/photo-1450133064473-71024230f91b?auto=format&fit=crop&w=500&q=80' },
      { id: 19, title: 'Malware Reverse Engineering', price: 'KSh 25,000', numericPrice: 25000, duration: '12 Weeks', img: 'https://images.unsplash.com/photo-1510511459019-5dda7724fd87?auto=format&fit=crop&w=500&q=80' },
      { id: 20, title: 'AWS Cloud Security Architect', price: 'KSh 21,000', numericPrice: 21000, duration: '8 Weeks', img: 'https://images.unsplash.com/photo-1451187580459-43490279c0fa?auto=format&fit=crop&w=500&q=80' }
    ];

    document.addEventListener('DOMContentLoaded', () => {
      const shopGrid = document.getElementById('shopGrid');
      if (!shopGrid) return;

      shopGrid.innerHTML = catalog.map(c => `
        <div class="bg-slate-900 rounded-2xl border border-slate-800 overflow-hidden flex flex-col justify-between hover:border-cyan-500/50 transition">
          <div>
            <img src="${c.img}" class="w-full h-36 object-cover">
            <div class="p-5">
              <span class="text-[10px] font-mono px-2 py-0.5 rounded bg-cyan-950 text-cyan-400 border border-cyan-800">${c.duration}</span>
              <h4 class="text-base font-bold text-white mt-2">${c.title}</h4>
              <p class="text-sm font-mono text-emerald-400 mt-2">${c.price}</p>
            </div>
          </div>
          <div class="px-5 pb-5">
            <button onclick="addToCart({ id: ${c.id}, title: '${c.title.replace(/'/g, "\\'")}', price: '${c.price}', numericPrice: ${c.numericPrice}, img: '${c.img}' })" 
                    class="w-full py-2.5 rounded-lg bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold text-xs transition flex items-center justify-center space-x-2">
              <i class="fa-solid fa-cart-plus"></i>
              <span>Add to Cart</span>
            </button>
          </div>
        </div>
      `).join('');
    });
  </script>
</body>
</html>
