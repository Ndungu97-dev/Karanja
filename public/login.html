<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Karanja Cyber Solutions & Academy</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .auth-container {
      background: #1e293b;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      width: 100%;
      max-width: 400px;
      border: 1px solid #334155;
    }
    h2 {
      margin-bottom: 24px;
      color: #38bdf8;
      text-align: center;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      color: #cbd5e1;
    }
    input {
      width: 100%;
      padding: 12px;
      background: #0f172a;
      border: 1px solid #475569;
      color: white;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 14px;
    }
    input:focus {
      outline: none;
      border-color: #38bdf8;
    }
    .btn {
      width: 100%;
      padding: 12px;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #2563eb;
    }
    .btn:disabled {
      background: #64748b;
      cursor: not-allowed;
    }
    .error-msg {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid #ef4444;
      color: #fca5a5;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 20px;
      font-size: 14px;
      display: none;
    }
    .footer-text {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: #94a3b8;
    }
    .footer-text a {
      color: #38bdf8;
      text-decoration: none;
    }
    .footer-text a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="auth-container">
    <h2>Karanja Cyber Academy</h2>
    
    <!-- Error Notification Box -->
    <div id="errorAlert" class="error-msg"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="student@karanjacaps.com" required />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required />
      </div>

      <button type="submit" id="loginBtn" class="btn">Sign In</button>
    </form>

    <div class="footer-text">
      Don't have an account? <a href="/register.html">Register here</a>
    </div>
  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const loginBtn = document.getElementById("loginBtn");
      const errorAlert = document.getElementById("errorAlert");
      
      // Clear previous errors & lock button to prevent multiple clicks
      errorAlert.style.display = "none";
      errorAlert.innerText = "";
      loginBtn.innerText = "Signing in...";
      loginBtn.disabled = true;

      const formData = new FormData(e.target);
      const data = Object.fromEntries(formData.entries());

      try {
        const response = await fetch("/api/auth/login", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(data)
        });

        const result = await response.json();

        if (response.ok) {
          // Success! Immediately route the browser to the dashboard URL provided by the backend
          console.log("Login successful, redirecting to:", result.redirectUrl);
          window.location.href = result.redirectUrl || "/dashboard.html";
        } else {
          // Show error message inside the form alert box
          errorAlert.innerText = result.error || "Invalid email or password.";
          errorAlert.style.display = "block";
          loginBtn.innerText = "Sign In";
          loginBtn.disabled = false;
        }
      } catch (err) {
        console.error("Network or server error during login:", err);
        errorAlert.innerText = "Connection failed. Please check your network.";
        errorAlert.style.display = "block";
        loginBtn.innerText = "Sign In";
        loginBtn.disabled = false;
      }
    });
  </script>

</body>
</html>
