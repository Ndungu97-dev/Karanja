<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Karanja Cyber Solutions</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans flex flex-col min-h-screen">

  <div id="shared-header"></div>
  <div id="shared-modals"></div>
  <div id="shared-cart-drawer"></div>

  <main class="flex-grow flex items-center justify-center py-12 px-4">
    <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl">
      <div class="text-center mb-8">
        <div class="w-12 h-12 rounded-xl bg-cyan-500/10 border border-cyan-500/30 flex items-center justify-center text-cyan-400 font-black text-xl mx-auto mb-4">
          <i class="fa-solid fa-lock"></i>
        </div>
        <h1 class="text-2xl font-black text-white">Welcome Back</h1>
        <p class="text-xs text-slate-400 mt-1">Sign in to manage your academy account & sessions</p>
      </div>
     <!-- Password Login Form -->
  <form id="password-login-form" class="space-y-4">
  <div>
    <label class="block text-slate-400 text-xs mb-1">Email Address</label>
    <input type="email" id="login-email" required class="w-full px-3 py-2 rounded-lg bg-slate-900 border border-slate-800 text-white focus:border-cyan-500 outline-none">
  </div>
  <div>
    <label class="block text-slate-400 text-xs mb-1">Password</label>
    <input type="password" id="login-password" required class="w-full px-3 py-2 rounded-lg bg-slate-900 border border-slate-800 text-white focus:border-cyan-500 outline-none">
  </div>
  <button type="submit" class="w-full py-2.5 rounded-lg bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold transition">
    Proceed to OTP
  </button>
</form>

<!-- OTP Verification Form (Hidden by default) -->
<form id="otp-verify-form" class="space-y-4 hidden">
  <div>
    <label class="block text-slate-400 text-xs mb-1">Enter 6-Digit OTP Code Sent to Email</label>
    <input type="text" id="login-otp" maxlength="6" required class="w-full px-3 py-2 rounded-lg bg-slate-900 border border-slate-800 text-white text-center tracking-widest text-lg focus:border-cyan-500 outline-none">
  </div>
  <button type="submit" class="w-full py-2.5 rounded-lg bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold transition">
    Verify & Login
  </button>
</form>

  

      <p class="text-xs text-slate-500 text-center mt-6">
        Don't have an account? <a href="register.html" class="text-cyan-400 font-bold hover:underline">Register here</a>
      </p>
    </div>
  
  <script>
    
    async function handleLogin(e) {
      e.preventDefault();
      const body = {
        email: document.getElementById('loginEmail').value,
        password: document.getElementById('loginPassword').value
      };

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const data = await res.json();
        if (data.success) {
          window.location.href = 'index.html';
        } else {
          alert(data.message);
        }
      } catch (err) {
        alert('Login failed.');
      }
    }
    let pendingEmail = '';

async function handleLogin(event) {
  event.preventDefault();
  const email = document.getElementById('login-email').value;
  const password = document.getElementById('login-password').value;

  const res = await fetch('/api/auth/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email, password })
  });
  const data = await res.json();

  if (data.success && data.requiresOtp) {
    pendingEmail = data.email;
    document.getElementById('password-login-form').classList.add('hidden');
    document.getElementById('otp-verification-form').classList.remove('hidden');
    showToast('OTP code sent to your email.');
  } else {
    showToast(data.message || 'Login failed', 'error');
  }
}

async function handleVerifyOtp(event) {
  event.preventDefault();
  const otp = document.getElementById('otp-code-input').value;

  const res = await fetch('/api/auth/verify-otp', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: pendingEmail, otp })
  });
  const data = await res.json();

  if (data.success) {
    showToast('Login successful! Redirecting...');
    setTimeout(() => window.location.href = 'dashboard.html', 1000);
  } else {
    showToast(data.message || 'Invalid OTP', 'error');
  }
}

    // Registration Handler
async function handleRegister(event) {
  event.preventDefault();
  const fullName = document.getElementById('reg-name').value;
  const email = document.getElementById('reg-email').value;
  const password = document.getElementById('reg-password').value;

  const res = await fetch('/api/auth/register', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ fullName, email, password })
  });
  const data = await res.json();

  if (data.success) {
    showToast(data.message, 'success'); // "Registration successful! Check your email to verify."
  } else {
    showToast(data.message || 'Registration failed.', 'error');
  }
}

// Logout Handler (can be called from dashboard or navbar)
async function handleLogout() {
  const res = await fetch('/api/auth/logout', { method: 'POST' });
  const data = await res.json();
  
  if (data.success) {
    showToast('Logged out successfully.', 'success');
    setTimeout(() => {
      window.location.href = 'login.html?logout=true';
    }, 1000);
  }
}
document.addEventListener("DOMContentLoaded", () => {
  const urlParams = new URLSearchParams(window.location.search);
  
  if (urlParams.get('expired') === 'true') {
    showToast('Your session has expired. Please log in again.', 'error');
    // Clean up the URL bar
    window.history.replaceState({}, document.title, window.location.pathname);
  }
  
  if (urlParams.get('logout') === 'true') {
    showToast('You have been logged out securely.', 'success');
    window.history.replaceState({}, document.title, window.location.pathname);
  }
});


  </script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>

</body>
</html>
