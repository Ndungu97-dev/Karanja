<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | Karanja Cyber Solutions</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans flex flex-col min-h-screen">

  <div id="shared-header"></div>
  <div id="shared-modals"></div>
  <div id="shared-cart-drawer"></div>

  <main class="flex-grow flex items-center justify-center py-12 px-4">
    <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl">
      <div class="text-center mb-8">
        <div class="w-12 h-12 rounded-xl bg-cyan-500/10 border border-cyan-500/30 flex items-center justify-center text-cyan-400 font-black text-xl mx-auto mb-4">
          <i class="fa-solid fa-user-plus"></i>
        </div>
        <h1 class="text-2xl font-black text-white">Create Account</h1>
        <p class="text-xs text-slate-400 mt-1">Join the Karanja Cyber Security Academy</p>
      </div>

      <form onsubmit="handleRegister(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-mono text-slate-400 mb-1">FULL NAME</label>
          <input type="text" id="regName" required class="w-full px-4 py-3 rounded-lg bg-slate-950 border border-slate-800 text-white text-xs outline-none focus:border-cyan-500">
        </div>
        <div>
          <label class="block text-xs font-mono text-slate-400 mb-1">EMAIL ADDRESS</label>
          <input type="email" id="regEmail" required class="w-full px-4 py-3 rounded-lg bg-slate-950 border border-slate-800 text-white text-xs outline-none focus:border-cyan-500">
        </div>
        <div>
          <label class="block text-xs font-mono text-slate-400 mb-1">PASSWORD</label>
          <input type="password" id="regPassword" required class="w-full px-4 py-3 rounded-lg bg-slate-950 border border-slate-800 text-white text-xs outline-none focus:border-cyan-500">
        </div>
        <button type="submit" class="w-full py-3 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold text-xs transition">Create Account</button>
      </form>

      <p class="text-xs text-slate-500 text-center mt-6">
        Already have an account? <a href="login.html" class="text-cyan-400 font-bold hover:underline">Sign in</a>
      </p>
    </div>
  </main>

  <script src="/js/app.js"></script>
  <script>
    async function handleRegister(e) {
      e.preventDefault();
      const body = {
        fullName: document.getElementById('regName').value,
        email: document.getElementById('regEmail').value,
        password: document.getElementById('regPassword').value
      };

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const data = await res.json();
        if (data.success) {
          window.location.href = 'index.html';
        } else {
          alert(data.message);
        }
      } catch (err) {
        alert('Registration failed.');
      }
    }
  </script>
</body>
</html>
