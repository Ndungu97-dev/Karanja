<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | Karanja Cyber Solutions & Academy</title>
  <style>
    :root {
      --bg-dark: #020617;
      --card-bg: #0f172a;
      --border-color: #1e293b;
      --accent-cyan: #06b6d4;
      --text-main: #f8fafc;
      --text-muted: #64748b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: monospace; }
    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .auth-container {
      width: 100%;
      max-width: 420px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 32px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .auth-header {
      margin-bottom: 24px;
      text-align: center;
    }
    .auth-header h2 {
      color: var(--accent-cyan);
      font-size: 22px;
      margin-bottom: 8px;
    }
    .auth-header p {
      color: var(--text-muted);
      font-size: 12px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
    }
    input {
      width: 100%;
      background: var(--bg-dark);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 12px;
      color: var(--text-main);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus {
      border-color: var(--accent-cyan);
    }
    button {
      width: 100%;
      background: var(--accent-cyan);
      color: var(--bg-dark);
      font-weight: bold;
      border: none;
      border-radius: 6px;
      padding: 12px;
      cursor: pointer;
      font-size: 14px;
      margin-top: 8px;
      transition: opacity 0.2s;
    }
    button:hover {
      opacity: 0.9;
    }
    .auth-footer {
      margin-top: 20px;
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
    }
    .auth-footer a {
      color: var(--accent-cyan);
      text-decoration: none;
    }
    .auth-footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="auth-container">
    <div class="auth-header">
      <h2>Create Account</h2>
      <p>Karanja Cyber Solutions & Academy</p>
    </div>

    <!-- Registration Form -->
    <form id="register-form">
      <div class="form-group">
        <label for="reg-name">Full Name</label>
        <input type="text" id="reg-name" placeholder="John Doe" required>
      </div>

      <div class="form-group">
        <label for="reg-email">Email Address</label>
        <input type="email" id="reg-email" placeholder="student@domain.com" required>
      </div>

      <div class="form-group">
        <label for="reg-password">Password</label>
        <input type="password" id="reg-password" placeholder="••••••••" required>
      </div>

      <button type="submit">Register & Get Welcome Email</button>
    </form>

    <div class="auth-footer">
      Already have an account? <a href="login.html">Log In</a>
    </div>
  </div>

  <!-- Authentication Script -->
  <script src="js/auth.js"></script>
</body>
</html>
