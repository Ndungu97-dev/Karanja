<!-- Modern Navigation Bar Component -->
<header class="sticky top-0 z-50 bg-slate-950/90 backdrop-blur-xl border-b border-slate-900">
  <div class="max-w-7xl mx-auto px-4 h-20 flex items-center justify-between">
    
    <!-- Brand Logo -->
    <a href="index.html" class="flex items-center gap-3 group">
      <div class="w-10 h-10 rounded-xl bg-cyan-500/10 border border-cyan-500/30 flex items-center justify-center text-cyan-400 font-black text-base group-hover:bg-cyan-500 group-hover:text-slate-950 transition-all duration-300 shadow-[0_0_15px_rgba(6,182,212,0.15)]">K</div>
      <div class="flex flex-col">
        <span class="text-sm font-black text-white tracking-wider">KARANJA CYBER</span>
        <span class="text-[10px] font-mono text-cyan-400 tracking-widest uppercase">Solutions & Academy</span>
      </div>
    </a>

    <!-- Desktop Navigation Links -->
    <nav class="hidden md:flex items-center gap-8 font-mono text-xs text-slate-300">
      <a href="index.html" class="hover:text-cyan-400 transition-colors">Home</a>
      <a href="about.html" class="hover:text-cyan-400 transition-colors">About Us</a>
      <a href="services.html" class="hover:text-cyan-400 transition-colors">Services</a>
      <a href="shop.html" class="hover:text-cyan-400 transition-colors">Academy Shop</a>
      <a href="contact.html" class="hover:text-cyan-400 transition-colors">Contact</a>
    </nav>

    <!-- Right Actions (Cart & Portal) -->
    <div class="flex items-center gap-4">
      <!-- Cart Drawer Trigger Button -->
      <button onclick="toggleCartDrawer()" class="relative p-2.5 rounded-xl bg-slate-900 border border-slate-800 hover:border-cyan-500 text-slate-300 hover:text-cyan-400 transition-all">
        <i class="fa-solid fa-cart-shopping text-sm"></i>
        <span id="cart-badge" class="absolute -top-1.5 -right-1.5 w-5 h-5 rounded-full bg-cyan-500 text-slate-950 font-mono text-[10px] font-bold flex items-center justify-center hidden shadow-lg">0</span>
      </button>

      <!-- Client Portal Button -->
      <a href="login.html" class="hidden md:inline-flex px-4 py-2.5 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold text-xs font-mono transition-all shadow-[0_0_20px_rgba(6,182,212,0.2)]">Client Portal</a>

      <!-- Mobile Menu Button -->
      <button onclick="toggleMobileMenu()" class="md:hidden p-2.5 rounded-xl bg-slate-900 border border-slate-800 text-slate-300 hover:text-cyan-400 transition">
        <i class="fa-solid fa-bars text-sm"></i>
      </button>
    </div>
  </div>

  <!-- Mobile Dropdown Menu -->
  <div id="mobile-menu" class="hidden md:hidden bg-slate-950 border-b border-slate-900 px-6 py-6 font-mono text-xs space-y-4 animate-fadeIn">
    <a href="index.html" class="block text-slate-300 hover:text-cyan-400 py-1 transition">Home</a>
    <a href="about.html" class="block text-slate-300 hover:text-cyan-400 py-1 transition">About Us</a>
    <a href="services.html" class="block text-slate-300 hover:text-cyan-400 py-1 transition">Services</a>
    <a href="shop.html" class="block text-slate-300 hover:text-cyan-400 py-1 transition">Academy Shop</a>
    <a href="contact.html" class="block text-slate-300 hover:text-cyan-400 py-1 transition">Contact</a>
    <div class="pt-4 border-t border-slate-900">
      <a href="login.html" class="block text-center w-full py-3 rounded-xl bg-cyan-500 text-slate-950 font-bold shadow-lg">Client Portal Login</a>
    </div>
  </div>
</header>
