<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart | Karanja Cyber Solutions</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans">

  <!-- Navigation -->
  <div id="navigation-container"></div>

  <!-- CART SECTION -->
  <section class="py-16 border-b border-slate-800 bg-slate-900/40">
    <div class="max-w-7xl mx-auto px-4">
      <h1 class="text-4xl font-extrabold text-white mb-2">Shopping Cart</h1>
      <p class="text-slate-400">Review your selected courses before checkout</p>
    </div>
  </section>

  <!-- CART ITEMS -->
  <section class="py-16">
    <div class="max-w-7xl mx-auto px-4 grid lg:grid-cols-3 gap-8">
      <!-- Cart Items Column -->
      <div class="lg:col-span-2">
        <div id="cartItemsContainer" class="space-y-4">
          <!-- Items will be inserted here -->
        </div>
        <div id="emptyCartMessage" class="text-center py-16">
          <i class="fa-solid fa-cart-plus text-6xl text-slate-600 mb-4"></i>
          <p class="text-slate-400 mb-6">Your cart is empty</p>
          <a href="shop.html" class="inline-block px-6 py-3 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold rounded-lg transition">
            Continue Shopping
          </a>
        </div>
      </div>

      <!-- Cart Summary -->
      <div class="bg-slate-900 rounded-2xl border border-slate-800 p-6 h-fit">
        <h2 class="text-xl font-bold text-white mb-6">Order Summary</h2>
        
        <div class="space-y-4 mb-6 pb-6 border-b border-slate-700">
          <div class="flex justify-between">
            <span class="text-slate-400">Subtotal</span>
            <span id="subtotalAmount" class="font-mono text-emerald-400">KSh 0</span>
          </div>
          <div class="flex justify-between">
            <span class="text-slate-400">Tax (0%)</span>
            <span class="font-mono text-emerald-400">KSh 0</span>
          </div>
        </div>

        <div class="flex justify-between mb-6">
          <span class="text-lg font-bold text-white">Total</span>
          <span id="totalAmount" class="text-lg font-mono text-emerald-400 font-bold">KSh 0</span>
        </div>

        <button id="checkoutBtn" class="w-full py-3 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold rounded-lg transition disabled:opacity-50 disabled:cursor-not-allowed" onclick="proceedToCheckout()">
          <i class="fa-solid fa-credit-card mr-2"></i>
          Proceed to Checkout
        </button>

        <a href="shop.html" class="block text-center mt-4 py-2 border border-slate-700 hover:border-slate-600 text-cyan-400 font-semibold rounded-lg transition">
          Continue Shopping
        </a>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <div id="footer-container"></div>

  <script src="/js/app.js"></script>
  <script>
    function displayCart() {
      const cart = getCart();
      const container = document.getElementById('cartItemsContainer');
      const emptyMsg = document.getElementById('emptyCartMessage');

      if (cart.length === 0) {
        container.innerHTML = '';
        emptyMsg.style.display = 'block';
        document.getElementById('checkoutBtn').disabled = true;
        return;
      }

      emptyMsg.style.display = 'none';
      document.getElementById('checkoutBtn').disabled = false;

      container.innerHTML = cart.map(item => `
        <div class="bg-slate-900 rounded-xl border border-slate-800 p-4 flex gap-4">
          <img src="${item.img}" alt="${item.title}" class="w-24 h-24 object-cover rounded-lg">
          <div class="flex-1">
            <h3 class="font-bold text-white">${item.title}</h3>
            <p class="text-sm text-slate-400">${item.price}</p>
            <div class="flex items-center gap-3 mt-3">
              <button onclick="updateQuantity(${item.id}, ${item.quantity} - 1)" class="px-3 py-1 bg-slate-800 hover:bg-slate-700 rounded">-</button>
              <span class="font-mono text-cyan-400 w-8 text-center">${item.quantity}</span>
              <button onclick="updateQuantity(${item.id}, ${item.quantity} + 1)" class="px-3 py-1 bg-slate-800 hover:bg-slate-700 rounded">+</button>
            </div>
          </div>
          <div class="text-right">
            <p class="font-mono text-emerald-400 font-bold">KSh ${(item.numericPrice * (item.quantity || 1)).toLocaleString()}</p>
            <button onclick="removeFromCart(${item.id})" class="text-red-400 hover:text-red-300 text-sm mt-4">
              <i class="fa-solid fa-trash"></i> Remove
            </button>
          </div>
        </div>
      `).join('');

      updateCartSummary();
    }

    function updateQuantity(productId, newQty) {
      if (newQty < 1) {
        removeFromCart(productId);
        return;
      }
      const cart = getCart();
      const item = cart.find(i => i.id === productId);
      if (item) {
        item.quantity = newQty;
        saveCart(cart);
        displayCart();
      }
    }

    function updateCartSummary() {
      const total = getCartTotal();
      document.getElementById('subtotalAmount').textContent = `KSh ${total.toLocaleString()}`;
      document.getElementById('totalAmount').textContent = `KSh ${total.toLocaleString()}`;
    }

    function proceedToCheckout() {
      const cart = getCart();
      if (cart.length === 0) {
        showToast('Your cart is empty', 'error');
        return;
      }
      window.location.href = 'checkout.html';
    }

    // Load on page load
    document.addEventListener('DOMContentLoaded', displayCart);
  </script>
</body>
</html>
